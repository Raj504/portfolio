<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RA">
    <!-- Solid accent tile: reads clearly at 16px in a tab strip, and stands
         out against the mostly-white favicons around it. -->
    <rect width="64" height="64" rx="15" fill="#38f0d4"/>
    <text x="32" y="33"
          text-anchor="middle"
          dominant-baseline="central"
          font-family="'Segoe UI', ui-sans-serif, system-ui, -apple-system, Arial, sans-serif"
          font-size="30"
          font-weight="700"
          letter-spacing="-1.5"
          fill="#05060a">RA</text>
</svg>
